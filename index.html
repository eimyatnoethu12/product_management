<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management Dashboard</title>
    <link rel="stylesheet" href="inc/style.css">
</head>
<body>
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <div class="bg-white p-6 shadow-md flex justify-between items-center">
            <h1 class="text-2xl text-blue-600 product-head">⚡ Product Management System</h1>
            <button id="logout-btn" onclick="logout()" class="hidden bg-red-500 px-4 py-2">Logout</button>
        </div>

        <!-- Auth Section -->
        <div id="auth-section" class="bg-white p-6 shadow-md max-w-md mx-auto">
            <div class="flex border-b mb-4">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600">Login</button>
                <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 font-bold text-gray-400">Register</button>
            </div>

            <!-- Login Form -->
            <div id="form-login" class="space-y-4">
                <input type="email" id="login-email" placeholder="Email Address" class="p-2 border" value="admin@gmail.com">
                <input type="password" id="login-password" placeholder="Password" class="p-2 border" value="123456">
                <button onclick="login()" class="w-full bg-blue-600 p-2">Sign In</button>
            </div>

            <!-- Register Form -->
            <div id="form-register" class="space-y-4 hidden">
                <h2 class="text-xl font-semibold">Create an account</h2>
                <input type="text" id="reg-name" placeholder="Full Name" class="p-2 border">
                <input type="email" id="reg-email" placeholder="Email Address" class="p-2 border">
                <input type="password" id="reg-password" placeholder="Password" class="p-2 border">
                <select id="reg-role" class="p-2 border">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
                <button onclick="register()" class="w-full bg-green-600 p-2">Register</button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden space-y-6">
            <div class="bg-white p-6 shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-blue-600">📦 Product Dashboard</h2>
                <div class="flex gap-2 mb-4 product-dash">
                    <input type="text" id="p-name" placeholder="Product Name" class="flex-1 p-2 border">
                    <input type="number" id="p-price" placeholder="Price ($)" class="w-32 p-2 border">
                    <button id="product-submit-btn" onclick="saveProduct()" class="bg-green-600 px-4 py-2">Add Product</button>
                    <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden bg-gray-500 px-3 py-2">Cancel</button>
                </div>
                <div id="product-list" class="space-y-2"></div>
            </div>

            <!-- Admin Dashboard -->
            <div id="admin-box" class="bg-white p-6 shadow-md hidden">
                <h2 class="text-xl font-semibold mb-4 text-purple-600">👑 Admin Dashboard - User Management</h2>
                <div id="user-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        const API = '/api';
        let token = localStorage.getItem('token') || '';
        let editProductId = null; // Track product being edited

        if (token) showDashboard();

        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
                document.getElementById('tab-login').className = 'flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600';
                document.getElementById('tab-register').className = 'flex-1 py-2 font-bold text-gray-400';
            } else {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-register').classList.remove('hidden');
                document.getElementById('tab-register').className = 'flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600';
                document.getElementById('tab-login').className = 'flex-1 py-2 font-bold text-gray-400';
            }
        }

        async function register() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;

            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                const data = await res.json();
                if (data.success) {
                    alert('အကောင့်ဖွင့်ခြင်း အောင်မြင်သည်!');
                    switchTab('login');
                } else { alert(data.message); }
            } catch (err) { alert('Server ချိတ်ဆက်၍ မရပါ'); }
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    alert('Login အောင်မြင်သည်!');
                    showDashboard();
                } else { alert(data.message); }
            } catch (err) { alert('Server ချိတ်ဆက်၍ မရပါ'); }
        }

        function logout() {
            localStorage.removeItem('token');
            token = '';
            cancelEdit();
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            document.getElementById('admin-box').classList.add('hidden');
        }

        async function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            loadProducts();
            loadUsers();
        }

        async function loadProducts() {
            try {
                const res = await fetch(`${API}/products`);
                const data = await res.json();
                const list = document.getElementById('product-list');
                list.innerHTML = data.data.map(p => `
                    <div class="flex justify-between items-center p-3 border bg-gray-50">
                        <span><b>${p.name}</b> — <span class="text-blue-600 font-semibold">$${p.price}</span></span>
                        <div class="flex gap-2">
                            <button onclick="editProduct('${p._id}', '${p.name}', ${p.price})" class="bg-yellow-500 px-3 py-1 text-sm">Edit</button>
                            <button onclick="deleteProduct('${p._id}')" class="bg-red-500 px-3 py-1 text-sm">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) { console.error(err); }
        }

        // Triggered when clicking Edit on a product
        function editProduct(id, name, price) {
            editProductId = id;
            document.getElementById('p-name').value = name;
            document.getElementById('p-price').value = price;
            
            const submitBtn = document.getElementById('product-submit-btn');
            submitBtn.textContent = 'Update Product';
            submitBtn.className = 'bg-blue-600 px-4 py-2';
            
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
        }

        // Cancel edit mode
        function cancelEdit() {
            editProductId = null;
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            
            const submitBtn = document.getElementById('product-submit-btn');
            submitBtn.textContent = 'Add Product';
            submitBtn.className = 'bg-green-600 px-4 py-2';
            
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        // Unified function for both Creating and Updating products
        async function saveProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;

            if (!name || !price) {
                alert('ကျေးဇူးပြု၍ အချက်အလက်များ အပြည့်အစုံထည့်ပါ။');
                return;
            }

            try {
                if (editProductId) {
                    // Update Product (PUT request)
                    await fetch(`${API}/products/${editProductId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ name, price })
                    });
                    cancelEdit();
                } else {
                    // Create Product (POST request)
                    await fetch(`${API}/products`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ name, price })
                    });
                    document.getElementById('p-name').value = '';
                    document.getElementById('p-price').value = '';
                }
                loadProducts();
            } catch (err) {
                alert('လုပ်ဆောင်ချက် မအောင်မြင်ပါ');
            }
        }

        async function deleteProduct(id) {
            await fetch(`${API}/products/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadProducts();
        }

        async function loadUsers() {
            try {
                const res = await fetch(`${API}/users`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('admin-box').classList.remove('hidden');
                    const list = document.getElementById('user-list');
                    list.innerHTML = data.data.map(u => `
                        <div class="flex justify-between items-center p-3 border bg-purple-50">
                            <span><b>${u.name}</b> (${u.email}) — Role: <span class="text-blue-600 font-bold">${u.role}</span></span>
                            <button onclick="deleteUser('${u._id}')" class="bg-red-500 px-3 py-1 text-sm">Delete User</button>
                        </div>
                    `).join('');
                }
            } catch (err) {}
        }

        async function deleteUser(id) {
            await fetch(`${API}/users/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadUsers();
        }
    </script>
</body>
</html>
